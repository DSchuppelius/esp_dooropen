name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host-Tests (SIP, Logik)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests mit AddressSanitizer/UBSan
        run: bash tests/host/run.sh

  build:
    name: Firmware ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [nodemcuv2, esp32dev, esp32dev_homekit, wt32-eth01]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # node prueft beim Bauen das JavaScript der Weboberflaeche (tools/embed_html.py)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: PlatformIO installieren
        run: pip install platformio
      - name: Bauen
        run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
