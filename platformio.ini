; PlatformIO Projekt fuer ESP8266 / ESP32 Tueroeffner
; Board: NodeMCU v2/v3 (30 Pins). Pin-Labels D1/D2/D5/D6 wie beim D1 mini.
[platformio]
; "pio run" baut nur diese; die *_ota-Umgebungen nur gezielt per -e
default_envs = nodemcuv2, esp32dev

; Gemeinsam fuer alle Umgebungen
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Weboberflaeche (src/web/index.html) gzip-komprimiert einbetten
extra_scripts = pre:tools/embed_html.py
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    knolleary/PubSubClient @ ^2.8
; ArduinoSIP liegt lokal unter lib/ArduinoSIP (um REGISTER, Digest mit qop,
; eingehende Anrufe u.a. erweitert)

; SIP-Debug-Ausgabe der ArduinoSIP-Lib: zum Fehlersuchen einkommentieren
; (kostet pro SIP-Paket Zeit auf der seriellen Schnittstelle)
; build_flags =
;     -DDEBUGLOG

[env:nodemcuv2]
; Aktueller Core 3.x (behebt Exception(3) im WiFiManager-Portal)
platform = espressif8266@^4.2.1
board = nodemcuv2
; 4 MB Flash: 1 MB Programm (+ OTA), 1 MB LittleFS fuer Einstellungen/Protokoll
board_build.filesystem = littlefs

; Fuer den kleinen Wemos/LOLIN D1 mini stattdessen:
; [env:d1_mini]
; board = d1_mini

; ------------------------------------------------------------
; ESP32 DevKit (WROOM-32) - Pins siehe src/config.h (GPIO26/27, LED GPIO2)
[env:esp32dev]
; Offizielle pioarduino-Plattform (Arduino 3.1.3) fest eingestellt: die gleichnamige
; Tasmota-Variante enthaelt kein TLS (HTTPS fuer Push-Mitteilungen)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
; Mehr Platz fuer das Programm (2x 1,9 MB fuer OTA), 128 KB LittleFS (Partition
; "spiffs") fuer Einstellungen/Protokoll. NVS liegt wie in der Standard-Aufteilung.
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
; Board wechselt nicht automatisch in den Download-Modus (defekter/fehlender
; Auto-Reset): BOOT+EN manuell latchen, esptool NICHT vorab resetten lassen.
board_upload.before_reset = no_reset
board_upload.after_reset = hard_reset
; Zusaetzlich nur fuer ESP32: Telegram-Bot (JSON)
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson @ ^7.2.0

; ------------------------------------------------------------
; ESP32 mit Apple Home (HomeKit, Bibliothek HomeSpan). Eigene Variante, weil
; HomeSpan ~400 KB belegt (Programmspeicher dann ~96 % voll) und schon beim Start
; in die WLAN-Einstellungen eingreift. Nur flashen, wenn Apple Home gebraucht wird.
; HomeSpan bewusst fest auf 2.0.0: ab 2.1 schaltet es schon vor setup() Auto-Reconnect
; und das Speichern der WLAN-Daten ab, ab 2.1.6 braucht es Arduino-Core 3.3.
[env:esp32dev_homekit]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    homespan/HomeSpan @ 2.0.0
build_flags =
    -DHOMEKIT_ENABLED

; ------------------------------------------------------------
; WT32-ETH01: ESP32 mit Ethernet (LAN8720) statt WLAN, z.B. mit PoE-Splitter.
; Pins siehe src/config.h (ETH_BOARD_WT32).
[env:wt32-eth01]
extends = env:esp32dev
board = wt32-eth01
build_flags =
    -DETH_BOARD_WT32

; ------------------------------------------------------------
; Update ueber WLAN (OTA), z.B.: pio run -e esp32dev_ota -t upload
; OTA ist nur aktiv, wenn in der Weboberflaeche ein Admin-Passwort gesetzt ist.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = tueroeffner.local
upload_flags = --auth=PASSWORT

[env:esp32dev_homekit_ota]
extends = env:esp32dev_homekit
upload_protocol = espota
upload_port = tueroeffner.local
upload_flags = --auth=PASSWORT

[env:wt32-eth01_ota]
extends = env:wt32-eth01
upload_protocol = espota
upload_port = tueroeffner.local
upload_flags = --auth=PASSWORT

[env:nodemcuv2_ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = tueroeffner.local
upload_flags = --auth=PASSWORT
